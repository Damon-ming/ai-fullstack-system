services:
  # 1. Ollama 大模型服务
  ollama:
    image: ollama/ollama:0.32.14
    container_name: ollama-server
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - /root/ming/ollama/.ollama:/root/.ollama
    runtime: nvidia
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    # 耗时
    # healthcheck:
    #   test: ["CMD-SHELL", "apt update >/dev/null 2>&1 && apt install -y curl >/dev/null 2>&1; curl -f http://localhost:11434/api/tags"]
    # interval: 10s
    # timeout: 5s
    # retries: 5

  # 2. Python 后端应用服务
  app-server:
    build:
      context: ./app-server
      dockerfile: Dockerfile # 指定同级目录下的 Dockerfile
    container_name: app-server
    restart: always
    ports:
      - "8000:8000" # 映射宿主机 8000 端口到容器 8000 端口
    volumes:
      - /root/ming/models:/app-server/models
      - /root/ming/logs/app-server:/app-server/logs
      - /root/ming/chroma_data:/app-server/chroma_data
      - /root/ming/knowledges:/app-server/src/com/damon/ming/knowledges
    environment:
      # 告诉后端代码通过容器名访问内部 Ollama
      - OLLAMA_BASE_URL=http://ollama-server:11434
      - LOG_LEVEL=DEBUG
    depends_on:
      - ollama
        # condition: service_healthy
    logging:
      driver: "json-file"
      options:
        # 日志文件宿主机路径
        max-size: "100m"
        max-file: "3"
    # 方式A：把stdout/stderr重定向到容器内文件（简单粗暴）
    # `>` 是 yaml 语法：多行字符串，把换行换成空格
    command: >
      sh -c "mkdir -p /app-server/logs && python3 -m src.com.damon.ming.main > /app-server/logs/app.log 2>&1"

  # React 前端
  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - app-server
