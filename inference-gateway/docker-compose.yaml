# inference-gateway/docker-compose.yaml
# 推理路由网关 + 推理后端容器 —— 独立子系统
#
# 通过 INFERENCE_SERVER 环境变量选择推理后端：
#   INFERENCE_SERVER=ollama  → 启动 Ollama 容器（默认）
#   INFERENCE_SERVER=vllm    → 启动 vLLM 集群
#
# 网关配置（路由表）通过 bind mount 运行时挂载，不烘焙进镜像。
# 原因：gateway.yaml 含明文路由 key（ak_pool_*），避免 key 进镜像层随镜像分发泄露。
# 若改为 COPY 进 Dockerfile，请先评估镜像是否会上传公共/共享仓库。
# 推理后端配置在本目录 config/docker/ 下。
# ai-network 在根 docker-compose.yaml 统一声明，此处不再重复定义。

services:
  # ── API Gateway ──────────────────────────────────────────────────
  # 按 api_key 路由到对应推理实例，透传 OpenAI 兼容接口
  inference-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inference-gateway
    restart: always
    expose:
      - "8080"
    volumes:
      # SECURITY: 路由配置含明文 ak_pool_* key，bind mount 只读挂载，
      # 不烘焙进镜像层，防止随镜像分发泄露。
      - ./config/gateway.yaml:/etc/gateway/gateway.yaml:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3
