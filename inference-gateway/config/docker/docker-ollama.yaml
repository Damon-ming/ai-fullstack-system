# inference-gateway/config/docker/docker-ollama.yaml
# Ollama 推理服务 —— INFERENCE_SERVER=ollama 时启动

services:
  ollama-server:
    image: ollama/ollama:0.32.14
    container_name: ollama-server
    restart: always
    expose:
      # SECURITY: P1-17/P1-28 改为 expose，仅 ai-network 内部可达。
      # Ollama 无认证，切断宿主机/外部直接访问。
      # OLLAMA_HOST 保持 0.0.0.0（容器内网需要），ORIGINS 清空（网关已处理 CORS）。
      - "11434"
    volumes:
      - ${DATA_DIR}/ollama/.ollama:/root/.ollama
    runtime: nvidia
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: ""
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    networks:
      - ai-network
