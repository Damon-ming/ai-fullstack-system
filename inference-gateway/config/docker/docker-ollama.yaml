# inference-gateway/config/docker/docker-ollama.yaml
# Ollama 推理服务 —— INFERENCE_SERVER=ollama 时启动

services:
  ollama-server:
    image: ollama/ollama:0.32.14
    container_name: ollama-server
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - /root/damon/ollama/.ollama:/root/.ollama
    runtime: nvidia
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    networks:
      - ai-network
