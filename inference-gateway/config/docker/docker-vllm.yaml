# inference-gateway/config/docker/docker-vllm.yaml
# vLLM 推理服务集群 —— INFERENCE_SERVER=vllm 时启动
#
# 架构：app-server → inference-gateway (按 api_key 路由) → vllm-{role} 实例
# Gateway 服务定义在本目录的 docker-compose.yaml，本文件仅定义推理实例。

services:
  # ── vLLM 实例 ────────────────────────────────────────────────────
  vllm-intent:
    image: vllm/vllm-openai:latest
    container_name: vllm-intent
    restart: always
    expose:
      - "8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/inference/Qwen2.5-0.5B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.3
      --max-model-len 2048
      --api-key akUpstream
    networks:
      - ai-network

  vllm-rewrite:
    image: vllm/vllm-openai:latest
    container_name: vllm-rewrite
    restart: always
    expose:
      - "8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/inference/Qwen2.5-1.8B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.4
      --max-model-len 4096
      --api-key akUpstream
    networks:
      - ai-network

  vllm-chat:
    image: vllm/vllm-openai:latest
    container_name: vllm-chat
    restart: always
    expose:
      - "8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/inference/Qwen2.5-7B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.7
      --max-model-len 8192
      --api-key akUpstream
    networks:
      - ai-network

  vllm-summary:
    image: vllm/vllm-openai:latest
    container_name: vllm-summary
    restart: always
    expose:
      - "8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/inference/Qwen2.5-1.5B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.4
      --max-model-len 4096
      --api-key akUpstream
    networks:
      - ai-network
