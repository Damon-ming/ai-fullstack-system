# inference-gateway/config/docker/docker-vllm.yaml
# vLLM 推理实例池 —— INFERENCE_SERVER=vllm 时启动
#
# 架构：app-server → inference-gateway (按 api_key 路由) → vllm-pool-{n}
# 路由层不感知业务语义，只认 api_key → upstream 映射。
#
# 新增实例：加一个 vllm-pool-{n} 服务 + gateway.yaml 加一条 route

services:
  # ── vLLM 实例池 ──────────────────────────────────────────────────
  vllm-pool-1:
    image: vllm/vllm-openai:latest
    container_name: vllm-pool-1
    restart: always
    expose:
      - "8000"
    volumes:
      - /root/damon/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/inference/Qwen2.5-7B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.7
      --max-model-len 8192
      --api-key akUpstream
    networks:
      - ai-network

  vllm-pool-2:
    image: vllm/vllm-openai:latest
