  # model-gateway/config/docker/docker-vllm-embedding.yaml
  # ── RAG embedding 服务 ────────────────────────────────────────────
  # BGE-M3 pooling / OpenAI-compatible /v1/embeddings
# --max-model-len 来自根目录 model-config.env，由 models.yaml 自动生成。
# TODO: 后续接入模型专属参数与 app-server 的输入上限、维度校验。
  # 独立使用新版本，避免升级现有生成模型池造成兼容性变化。
services:
  vllm-embedding:
    extends:
      file: docker-vllm-common.yaml
      service: vllm-base
    container_name: vllm-embedding
    environment:
      HF_HUB_CACHE: ${MODEL_ROOT_DIR}/embedding
    command: >
      --host 0.0.0.0 --port 8000
      --model BAAI/bge-m3
      --runner pooling
      --hf-overrides '{"architectures":["BgeM3EmbeddingModel"]}'
      --max-model-len ${BGE_M3_MAX_MODEL_LEN}
      --gpu-memory-utilization ${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.1}
      --api-key uk_embedding
    healthcheck:
      start_period: 300s
