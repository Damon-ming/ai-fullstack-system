# model-gateway/config/docker/docker-vllm-inference.yaml
# vLLM 文本生成实例池 —— INFERENCE_SERVER=vllm 时启动
#
# 架构：app-server → model-gateway (按 api_key 路由) → 主推理池 / 摘要池 / 护栏池
# 路由层不感知业务语义，只认 api_key → upstream 映射。
#
# 新增实例：添加服务并在 gateway.yaml 添加对应 route
# 各实例 --max-model-len 从 model-gateway/config/models.yaml 导出。
#
# 使用 vLLM 0.17.0：Qwen3Guard-Gen 要求 vLLM >=0.9.0。

services:
  # ── vLLM 实例池 ──────────────────────────────────────────────────
  # 主推理池：服务常规 inference 请求。
  vllm-inferences-001:
    extends:
      file: docker-vllm-common.yaml
      service: vllm-base
    container_name: vllm-inferences-001
    command: >
      --host 0.0.0.0 --port 8000
      --model ${MODEL_ROOT_DIR}/inference/Qwen2.5-1.5B-Instruct
      --served-model-name qwen2.5-1.5B-instruct
      --gpu-memory-utilization 0.4
      --max-model-len ${QWEN2_5_1_5B_INSTRUCT_MAX_MODEL_LEN:?run model-gateway/export_model_env.py first}
      --api-key uk_inference_001
    healthcheck:
      start_period: 300s

  # 摘要池：与主推理池隔离，避免摘要请求占用主推理并发。
  vllm-inferences-002:
    extends:
      file: docker-vllm-common.yaml
      service: vllm-base
    container_name: vllm-inferences-002
    command: >
      --host 0.0.0.0 --port 8000
      --model ${MODEL_ROOT_DIR}/inference/Qwen2.5-0.5B-Instruct
      --served-model-name qwen2.5-0.5B-instruct
      --gpu-memory-utilization 0.3
      --max-model-len ${QWEN2_5_0_5B_INSTRUCT_MAX_MODEL_LEN:?run model-gateway/export_model_env.py first}
      --api-key uk_inference_002
    healthcheck:
      start_period: 120s

  # 独立护栏池：专用 Qwen3Guard-Gen 模型，与主推理模型实例隔离。
  vllm-guardrail:
    extends:
      file: docker-vllm-common.yaml
      service: vllm-base
    container_name: vllm-guardrail
    command: >
      --host 0.0.0.0 --port 8000
      --model ${MODEL_ROOT_DIR}/inference/Qwen3Guard-Gen-0.6B
      --served-model-name qwen3guard-gen-0.6b
      --max-model-len ${QWEN3GUARD_GEN_0_6B_MAX_MODEL_LEN:?run model-gateway/export_model_env.py first}
      --gpu-memory-utilization 0.1
      --api-key uk_guardrail
    healthcheck:
      start_period: 180s


