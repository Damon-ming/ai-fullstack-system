[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fullstack-model-config"
version = "0.1.0"
description = "Shared model configuration library"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]

[tool.setuptools]
packages = ["model_config"]
package-dir = {model_config = "."}

[tool.setuptools.package-data]
model_config = ["models.yaml"]
