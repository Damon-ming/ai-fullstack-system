# app-server/docker-compose.yaml
# 后端应用服务 + PostgreSQL 数据库 —— 同生同死的私有基础设施
#
# 连接 inference-gateway 的方式：
#   INFERENCE_SERVER  推理后端类型：ollama / vllm / sglang（决定连接配置）
#   INFERENCE_GATEWAY_URL 网关地址（默认 http://inference-gateway:8080/v1）
#
# 环境变量全部来自根目录 .env，不在此文件重复定义

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    restart: always
    # SECURITY: 仅暴露给 Docker 内部网络，不映射到宿主机端口（P1-6 修复）
    # 容器名 postgres 在 ai-network 内可正常解析，app-server 不受影响
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: "Asia/Shanghai"
      LANG: "C.UTF-8"
    volumes:
      - /root/damon/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d damon"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ai-network

  # ── FastAPI 后端 ───────────────────────────────────────────────────
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_BUILD_ENV: ${SERVER_BUILD_ENV:-0}
    container_name: app-server
    restart: always
    expose:
      - "8000"
    volumes:
      - ${DATA_DIR}/logs/app-server:/app-server/logs
      - ${DATA_DIR}/chroma:/app-server/chroma
      - ${DATA_DIR}/knowledges:/app-server/knowledges
    environment:
      - LOG_LEVEL=DEBUG
      - INFERENCE_SERVER=${INFERENCE_SERVER:-ollama}
      - INFERENCE_GATEWAY_URL=http://inference-gateway:8080/v1
      - INFERENCE_API_KEYS={"chat":"ak_pool_001","intent":"ak_pool_002","rewrite":"ak_pool_003","summary":"ak_pool_004","guardrail":"ak_pool_005"}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MASTER_KEY=${MASTER_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-production-domain.com}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - ai-network
    depends_on:
      postgres:
        condition: service_healthy
      inference-gateway:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /app-server/logs \
        && python3 -m src.com.damon.ming.main > /app-server/logs/app.log 2>&1"
