# app-server/docker-compose.yaml
# 后端应用服务 + 推理后端（通过 include 按需加载）
#
# 启动命令：
#   SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 INFERENCE_SERVER=vllm COMPOSE_PROFILES=vllm docker compose up -d --build
#
# INFERENCE_SERVER 控制 app 读哪个连接模板（config/templates/{ollama|vllm}.yaml）
# COMPOSE_PROFILES 控制启哪组推理容器（ollama / vllm）

include:
  - inference/docker-ollama.yaml
  - inference/docker-vllm.yaml

networks:
  ai-network:
    driver: bridge

services:
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_BUILD_ENV: ${SERVER_BUILD_ENV:-0}
    container_name: app-server
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - /root/ming/models:/app-server/models
      - /root/ming/logs/app-server:/app-server/logs
      - /root/ming/chroma_data:/app-server/chroma_data
      - /root/ming/knowledges:/app-server/src/com/damon/ming/knowledges
    environment:
      - LOG_LEVEL=DEBUG
      - INFERENCE_SERVER=${INFERENCE_SERVER:-ollama}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - ai-network
    command: >
      sh -c "mkdir -p /app-server/logs \
        && python3 -m src.com.damon.ming.main > /app-server/logs/app.log 2>&1"
