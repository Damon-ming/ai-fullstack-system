# app-server/docker-compose.yaml
# 后端应用服务 + PostgreSQL 数据库 —— 同生同死的私有基础设施
#
# 连接 model-gateway 的方式：
#   INFERENCE_SERVER 推理后端类型（默认 vllm，目前仅实现 vllm）
#   INFERENCE_GATEWAY_URL 网关地址（在本文件中显式注入）
#
# 根 Compose 负责注入共享模型环境变量；本文件只定义 app-server 服务本身。

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: server-postgres
    restart: always
    # SECURITY: 仅暴露给 Docker 内部网络，不映射到宿主机端口（P1-6 修复）
    # 容器名 postgres 在 ai-network 内可正常解析，app-server 不受影响
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: "Asia/Shanghai"
      LANG: "C.UTF-8"
    volumes:
      - /root/damon/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ai-network

  # ── FastAPI 后端 ───────────────────────────────────────────────────
  app-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_BUILD_ENV: ${SERVER_BUILD_ENV:-0}
    container_name: ${APP_NAME}
    restart: always
    expose:
      - "8000"
    volumes:
      - ${DATA_DIR}/logs/${APP_NAME}:/${APP_NAME}/logs
      - ${DATA_DIR}/chroma:/${APP_NAME}/chroma
      - ${DATA_DIR}/corpus:/${APP_NAME}/corpus
      - ${DATA_DIR}/models:${MODEL_ROOT_DIR}
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - INFERENCE_SERVER=${INFERENCE_SERVER:-vllm}
      - INFERENCE_GATEWAY_URL=http://model-gateway:8080/v1
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MASTER_KEY=${MASTER_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-production-domain.com}
      - TRUSTED_PROXY_CIDRS=${PROXY_NETWORK_SUBNET:-172.30.20.0/24}
      - MODEL_ROOT_DIR=${MODEL_ROOT_DIR}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - ai-network
      - proxy-network
    depends_on:
      postgres:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /${APP_NAME}/logs \
        && python3 -m src.com.damon.ming.main > /${APP_NAME}/logs/app.log 2>&1"
