# app-server/src/com/damon/ming/ai/rag/tokenizer/config/tokenizer-config.yaml
# 分词器实例配置。每个顶层键是实例名，tokenizer_engine 选择实现。
# llm_counter 当前固定使用 cl100k_base；生成模型变更后应改为与模型匹配的 tokenizer。
# TODO: 从生成模型配置选择 tokenizer，避免换模型时手动同步。

# LLM token 计数（用于上下文窗口管理）
llm_counter:
  tokenizer_engine: tiktoken
  params:
    encoding_name: cl100k_base

# BM25 中文词语切分（用于关键词检索）
bm25_searcher:
  tokenizer_engine: jieba
  params:
    dicts_dir: dicts  # 相对于 tokenizer/ 目录；自动加载其中所有 .txt 词典
