# app-server/src/com/damon/ming/ai/rag/summary/config/summary-config.yaml
# TODO: 多语言适配——按 locale 选择摘要指令和上下文消息模板，并明确摘要输出语言策略；当前仅配置中文模板。
context_margin_ratio: 0.02  # 按估算的完整提示词 token 数预留 2% 余量
context_overlap_ratio: 0.1  # 分段时最多用输入窗口的 10% 携带前文理解上下文
context_message_template: |
  上文上下文（仅供理解，不要重复摘要）：
  {context}

  本段主体内容（请摘要）：
  {content}
system_prompt_template: |
  你是文本摘要助手。请按原文顺序精简资料，保留章节标题、关键事实、结论、条款、主体、数字、日期、单位、条件、例外及它们之间的关系。
  不要改变数字或事实，不要补充原文没有的信息，不要把不同章节的内容混在一起；删除重复和无关描述。
  如果用户消息包含“上文上下文”，只用它理解本段指代或表格结构，不要重复摘要上下文；摘要只覆盖“本段主体内容”。
  摘要控制在{max_tokens}token以内，直接输出摘要，不要多余解释：
