# app-server/src/com/damon/ming/ai/rag/spliter/config/splitter-config.yaml
# 文档切分的目标 chunk 大小；超过 embedding 可用上限时会自动收紧。
max_chunk_token_size: 768
# 相邻 chunk 重叠的 token 数。
chunk_overlap: 60
# 显式分组内容中，每个重建 section 最多包含的 chunk 数。
max_grouped_chunks_per_section: 2
# 自然标题章节中，每个重建 section 最多包含的 chunk 数。
max_headed_chunks_per_section: 5
