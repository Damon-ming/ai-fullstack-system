# app-server/src/com/damon/ming/ai/rag/rerank/config/rerank-config.yaml
# 当前使用一个多语言重排器处理中文、英文及混合语言内容。
# 模型目录位于 MODEL_ROOT_DIR/rerank/ 下，配置只填写模型目录名。
# TODO: 从统一模型配置读取模型名与支持的最大长度；按模型能力校验
# max_seq_len，batch_size 和 window_overlap 保留为可调的运行策略。
#
# 后续只有在中英文评测显示单模型效果不足时，再增加按语言路由的模型实例。
# ── BGE-Reranker-v2-M3（中英文共用）───────────────
bge_reranker_v2_m3:
  model_name: bge-reranker-v2-m3
  batch_size: 16
  max_seq_len: 1024
  device: cuda
  # 滑动窗口：长 section 切窗打分后取 max，替代 rerank 前的 LLM 有损压缩
  window_overlap: 128
  max_windows_per_node: 5
  # 打分时附加章节标题链（heading_path），无该元数据的文档自动跳过
  include_heading: true
  heading_prefix_template: "[{heading_path}]"
  # TODO: 多语言场景后续根据 query 或文档语言选择对应的标题前缀模板。
