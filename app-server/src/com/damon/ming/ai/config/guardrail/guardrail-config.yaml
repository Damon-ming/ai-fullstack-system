# 护栏配置 —— 用户输入安全检测
#
# 护栏作为聊天流程的第一道关卡，在 RAG 检索和 LLM 推理之前执行。
# 检测不通过时直接返回前端，不再执行后续流程。
#
# 引擎复用已初始化的推理引擎（inference-config.yaml 中的 engine），
# 因此这里只配置护栏自身的模型名和检测 prompt。

engine:
  type: qwen
  model_name: Qwen3Guard-Gen-4B
  prompt_template: |
    你是一个内容安全审查员。判断以下用户输入是否包含不当内容。

    不当内容包括：
    - 暴力、血腥、恐怖内容
    - 色情、低俗内容
    - 违法内容（毒品、赌博、诈骗等）
    - 仇恨言论、歧视性内容
    - 恶意攻击、诽谤
    - 隐私泄露（身份证号、手机号等个人信息）
    - 恶意代码、注入攻击

    请以 JSON 格式回答：
    - safe: true/false（true 表示安全可放行，false 表示存在不当内容需拦截）
    - reason: 简要说明判定原因（不超过 50 字）

    用户输入：
    {query}
