# app-server/src/com/damon/ming/ai/config/inference-params.yaml
# 模型级推理参数 —— 与推理服务无关，任何后端（Ollama/vLLM/SGLang）通用
#
# 改模型行为只改这一个文件。
# 连接/路由配置在 ai 模块外层的 config/inference.yaml（部署时由模板生成）。
#
# 环境变量覆盖：CHAT_TEMPERATURE=0.5（ROLE_PARAM 格式，最高优先级）

roles:
  chat:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 4096

  intent:
    temperature: 0.3
    top_p: 0.95
    max_tokens: 512

  rewrite:
    temperature: 0.5
    top_p: 0.9
    max_tokens: 256

  summary:
    temperature: 0.4
    top_p: 0.9
    max_tokens: 4096

  guardrail:
    temperature: 0.1
    top_p: 0.95
    max_tokens: 256
