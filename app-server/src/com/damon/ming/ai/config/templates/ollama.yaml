# app-server/src/com/damon/ming/ai/config/templates/ollama.yaml
# Ollama 模板 —— 部署时复制为 ../backends.yaml
#
# Ollama 单容器多模型，直连，无 gateway。
# api_key 为空（Ollama 不校验），model 必须指定。

base_url: http://ollama-server:11434
default_timeout: 180

roles:
  chat:
    api_key: ""
    model: qwen2.5:7b-instruct
    temperature: 0.7
    top_p: 0.9
    max_tokens: 4096

  intent:
    api_key: ""
    model: qwen:0.5b
    temperature: 0.3
    top_p: 0.95
    max_tokens: 512

  rewrite:
    api_key: ""
    model: qwen:1.8b
    temperature: 0.5
    top_p: 0.9
    max_tokens: 256

  summary:
    api_key: ""
    model: qwen2.5:1.5b-instruct
    temperature: 0.4
    top_p: 0.9
    max_tokens: 4096

  guardrail:
    api_key: ""
    model: qwen:0.5b
    temperature: 0.1
    top_p: 0.95
    max_tokens: 256
