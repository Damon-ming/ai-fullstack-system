# app-server/src/com/damon/ming/ai/config/backends.yaml
# ═══════════════════════════════════════════════════════════════════
# 后端统一配置 —— app-server 唯一配置
#
# 部署时由 compose 根据 INFERENCE_SERVER 环境变量从模板生成：
#   config/templates/vllm.yaml  → 本文件（INFERENCE_SERVER=vllm）
#   config/templates/ollama.yaml → 本文件（INFERENCE_SERVER=ollama）
#
# 包含：连接地址 + 各角色的 api_key + 业务参数
# 不包含：容器编排、路由表（那些在 inference/ 目录）
#
# 改模型参数：改本文件，重启容器生效。
# 环境变量覆盖：CHAT_TEMPERATURE=0.5（ROLE_PARAM 格式，最高优先级）
# ═══════════════════════════════════════════════════════════════════

base_url: http://vllm-gateway:8080/v1
default_timeout: 180

roles:
  chat:
    api_key: ak_chat_001
    model: ""
    temperature: 0.7
    top_p: 0.9
    max_tokens: 4096

  intent:
    api_key: ak_intent_001
    model: ""
    temperature: 0.3
    top_p: 0.95
    max_tokens: 512

  rewrite:
    api_key: ak_rewrite_001
    model: ""
    temperature: 0.5
    top_p: 0.9
    max_tokens: 256

  summary:
    api_key: ak_summary_001
    model: ""
    temperature: 0.4
    top_p: 0.9
    max_tokens: 4096

  guardrail:
    api_key: ak_intent_001          # 复用 intent 实例（同模型）
    model: ""
    temperature: 0.1
    top_p: 0.95
    max_tokens: 256
