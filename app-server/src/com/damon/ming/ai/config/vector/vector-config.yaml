# app-server/src/com/damon/ming/ai/config/vector-config.yaml
# 向量存储配置 —— 由 VectorConfigLoader 读取，注入 vector_db 模块。
# vector_db 模块本身不包含任何配置文件，纯参数化调用。
#
# 上层调用方必须显式指定引擎名：VectorConfigLoader().load("pgvector")
# 引擎名称与实现类的映射在 vector_db/__init__.py 中通过 @register_engine 维护。

vector_engines:
  chroma:
    params:
      collection_name: rag_documents
      persist_directory: ./chroma
      embedding_dimension: 1024
      cache_max: 5000  
  pgvector:
    params:
      connection_string: ${DB_URL}
      embedding_dimension: 1024
      table_name: rag_documents
      pool_min_conn: 2
      pool_max_conn: 10
      # pgvector HNSW 索引参数
      hnsw_m: 16
      hnsw_ef_construction: 240
      # LRU 缓存上限
      cache_max: 5000