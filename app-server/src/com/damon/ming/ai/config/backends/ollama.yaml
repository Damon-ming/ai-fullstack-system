# app-server/src/com/damon/ming/ai/config/backends/ollama.yaml
# Ollama 后端 —— 唯一权威配置
#
# Ollama 单容器多模型，api_key 留空（不校验）。
# gateway_url 直接指向 ollama-server。
#
# 和 vllm.yaml 格式一致，InferenceConfigLoader 统一处理。

gateway_url: http://ollama-server:11434
default_timeout: 180

roles:
  chat:
    api_key: ""                         # Ollama 不需要 key
    model: qwen2.5:7b-instruct
    temperature: 0.7
    top_p: 0.9
    max_tokens: 4096

  intent:
    api_key: ""
    model: qwen:0.5b
    temperature: 0.3
    top_p: 0.95
    max_tokens: 512

  rewrite:
    api_key: ""
    model: qwen:1.8b
    temperature: 0.5
    top_p: 0.9
    max_tokens: 256

  summary:
    api_key: ""
    model: qwen2.5:1.5b-instruct
    temperature: 0.4
    top_p: 0.9
    max_tokens: 4096

  guardrail:
    api_key: ""
    model: qwen:0.5b
    temperature: 0.1
    top_p: 0.95
    max_tokens: 256
