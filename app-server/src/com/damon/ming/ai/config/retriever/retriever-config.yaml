# app-server/src/com/damon/ming/ai/config/retriever/retriever-config.yaml
retrievers:
  common:
    # 最终输出大小：reranker 精选后保留的 section 数（决定上下文量级）
    top_k: 5
    # 候选池大小：检索器返回给 reranker 的 section 数（决定 precision 上限）
    retrieve_top_k: 20
    dense_top_k: 30
    sparse_top_k: 30
    dedup_by_section: true
    dense_weight: 0.7
    sparse_weight: 0.3
    fuse_k: 40
    params:
      # section 去重不足时的最大放大倍数（循环扩大检索范围上限）
      max_section_oversample_multiplier: 5
      # RRF 融合时的过采样倍数（给后续 section 去重留余量）
      rrf_oversample_multiplier: 2
