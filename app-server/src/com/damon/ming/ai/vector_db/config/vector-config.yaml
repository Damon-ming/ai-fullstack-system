# app-server/src/com/damon/ming/ai/vector_db/config/vector-config.yaml
# 向量存储配置 —— 由 VectorConfigLoader 读取静态 YAML 参数。
# embedding_dimension 由 VectorStoreManager 从当前 embedding 模型规格动态注入。

# chroma:
#   table_name: rag_documents  # Chroma 会将其用作 collection 名称
#   persist_directory: ./chroma

pgvector:
  connection_string: ${DB_URL}
  table_name: rag_documents
  pool_min_conn: 2
  pool_max_conn: 10
  pool_recycle: 3600  # 连接年龄回收阈值（秒）
  # pgvector HNSW 索引参数
  hnsw_m: 16
  hnsw_ef_construction: 240
