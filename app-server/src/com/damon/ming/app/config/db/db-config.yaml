# app-server/src/com/damon/ming/app/config/db-config.yaml
# 数据库连接配置 —— 由 DbConfigLoader 读取，注入 db 模块。
# db 模块本身不包含任何配置文件，纯参数化调用。
#
# 支持多数据库后端，通过拆解字段 + dialect 自动拼装 SQLAlchemy URL：
#   PostgreSQL:  dialect: postgresql
#   MySQL:       dialect: mysql  driver: pymysql
#   SQLite:      dialect: sqlite  dbname: /path/to/db.sqlite

db:
  # 通用环境：本地 PostgreSQL
  common:
    dialect: postgresql
    driver: psycopg2
    host: localhost
    port: 5432
    dbname: damon_dev
    user: postgres
    password: ""
    pool_size: 5
    max_overflow: 10
    connect_timeout: 10
    retry: 3
    backoff: 0.1
