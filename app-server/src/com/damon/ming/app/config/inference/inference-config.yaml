# 推理网关连接超时、共享并发上限和各用途模型配置。
# 引擎、网关地址及各角色 API key 从环境变量加载。
inference:
  transport:
    timeout_seconds: 180
  max_concurrency: 16  # 所有 role 共享的推理并发上限
  roles:
    inference:
      model_name: qwen2.5-0.5B-instruct
      options:
        temperature: 0.1
        top_p: 0.9
        max_tokens: 1024
    intent:
      model_name: qwen2.5-0.5B-instruct
      options:
        temperature: 0.3
        top_p: 0.95
        max_tokens: 256
    rewrite:
      model_name: qwen2.5-0.5B-instruct
      options:
        temperature: 0.5
        top_p: 0.9
        max_tokens: 256
    summary:
      model_name: qwen2.5-0.5B-instruct
      options:
        temperature: 0.1
        top_p: 0.9
        max_tokens: 1024
    guardrail:
      model_name: qwen2.5-0.5B-instruct
      options:
        temperature: 0.1
        top_p: 0.95
        max_tokens: 256
