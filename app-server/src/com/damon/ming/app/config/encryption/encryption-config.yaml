# app-server/src/com/damon/ming/app/config/encryption/encryption-config.yaml
# 加密体系业务配置 —— 由 app_initializer 读取，注入 encryption 模块。
# encryption 模块本身不包含任何配置文件，纯参数化调用。

encryption:
  # 本文件只放「随环境变化的加密参数」。
  # 加密豁免白名单是环境无关的 HTTP 路由策略，已移至
  # app/config/system/system-config.yaml 的 whitelist 节点。

  # 开发环境
  debug:
    rsa_key_size: 2048
    session_ttl_hours: 24
    sign_context: "ai-fullstack-signature-v1"
    kek_salt: "encryption-key-store-v1"
    kek_info: "encryption-session-key-wrap"
    data_key_id: "data-key-v1"

  # 生产环境
  release:
    rsa_key_size: 4096
    session_ttl_hours: 12
    sign_context: "ai-fullstack-signature-v1"
    kek_salt: "encryption-key-store-v1"
    kek_info: "encryption-session-key-wrap"
    data_key_id: "data-key-v1"
