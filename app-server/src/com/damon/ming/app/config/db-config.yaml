# app-server/src/com/damon/ming/app/config/db-config.yaml
# 数据库连接配置 —— 由 app_initializer 读取，注入 db 模块。
# db 模块本身不包含任何配置文件，纯参数化调用。

db:
  # 开发环境：本地 PostgreSQL
  default:
    host: localhost
    port: 5432
    dbname: damon_dev
    user: postgres
    password: ""
    pool_min: 1
    pool_max: 5
    connect_timeout: 10
    retry: 3
    backoff: 0.1

  # 生产环境：通过环境变量覆盖（DB_CONNECTION 优先级更高）
  production:
    host: localhost
    port: 5432
    dbname: damon_prod
    user: postgres
    password: ""
    pool_min: 2
    pool_max: 10
    connect_timeout: 15
    retry: 5
    backoff: 0.5
