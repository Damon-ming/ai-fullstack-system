# app-server/src/com/damon/ming/app/config/ai/rag/modules/tokenizer.yaml
# tokenizer 模块配置。
# llm_counter 当前使用 cl100k_base；生成模型变更后需与模型 tokenizer 对齐。
roles:
  llm_counter:
    tokenizer_engine: tiktoken
    params:
      encoding_name: cl100k_base
  bm25_searcher:
    tokenizer_engine: jieba
    params:
      # 相对于本 YAML 文件；应用加载器解析为绝对路径后传给 tokenizer。
      # todo:检查代码
      dicts_dir: .
