# app-server/src/com/damon/ming/app/config/ai/chat-config.yaml
# AI 并发控制配置（asyncio.Semaphore）—— 由 ChatConfigLoader 读取，注入 chat_router。
#
# 分组说明：
#   inference  —— 推理段（主推理 + 摘要/压缩共享同一信号量）
#                 vLLM 服务端内部连续批处理，信号量作为安全上限而非吞吐瓶颈
#   rag        —— RAG 检索段（反压控制，匹配 retrieval_pool 能力）
#   guardrail  —— 护栏检测（小模型，独立限流）
#
# 注意：线程池（物理线程）配置在 app/config/thread/thread-pool-config.yaml

chat:
  common:
    system_prompt: |
      你是严格基于知识库的问答助手，必须遵守以下硬性规则，绝对不能违反：
      1. 只能使用【参考知识库】内存在的内容回答用户问题；
      2. 如果参考知识库为空、或者没有和用户问题相关的内容，直接只输出：语料库没有相关资料。；
      3. 禁止使用你自身内置常识、禁止脑补、禁止推测、禁止编造任何原文不存在的信息；
      4. 回答使用标准Markdown格式输出，存在多条内容用有序/无序列表，重点内容加粗，表格原样保留；
      5. 回答精简，不要多余解释、不要分析、不要思考过程；
      6. 不允许输出无关内容，严格遵守知识库边界。

      【参考知识库】
      {ref_content}

    inference:
      semaphore: 16      # 推理信号量上限（主推理 + 摘要/压缩共享）
                        # vLLM 内部批处理，此值为安全上限，不限制正常吞吐
      timeout: 30        # 单次推理+检索最大等待秒数

    rag:
      semaphore: 3       # RAG 检索段信号量上限（反压控制）

    guardrail:
      semaphore: 2       # 护栏 LLM 调用信号量上限（4B 小模型快速分类，2 足够）
      timeout: 5         # 护栏检测独立超时（秒），超时 fail-open 放行

    retry_ms: 3000       # SSE 重连等待毫秒数
