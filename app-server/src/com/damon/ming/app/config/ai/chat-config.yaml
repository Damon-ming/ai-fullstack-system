# app-server/src/com/damon/ming/app/config/ai/chat-config.yaml
# 聊天模块业务配置 —— 由 ChatConfigLoader 读取，注入 chat_router。
#
# 包含：
#   system_prompt —— RAG 问答的系统模板（{ref_content} 为知识库占位符）
#   infer_concurrency —— 同时执行 LLM 推理的并发上限
#   rag_concurrency —— RAG 检索段的并发上限（建议 = infer_concurrency × 2，防止线程池过载）
#   guardrail_timeout —— 护栏检测独立超时（秒），超时 fail-open 放行
#   infer_timeout —— 单次推理+检索的最大等待秒数
#   retry_ms —— SSE 重连等待毫秒数

chat:
  common:
    system_prompt: |
      你是严格基于知识库的问答助手，必须遵守以下硬性规则，绝对不能违反：
      1. 只能使用【参考知识库】内存在的内容回答用户问题；
      2. 如果参考知识库为空、或者没有和用户问题相关的内容，直接只输出：语料库没有相关资料。；
      3. 禁止使用你自身内置常识、禁止脑补、禁止推测、禁止编造任何原文不存在的信息；
      4. 回答使用标准Markdown格式输出，存在多条内容用有序/无序列表，重点内容加粗，表格原样保留；
      5. 回答精简，不要多余解释、不要分析、不要思考过程；
      6. 不允许输出无关内容，严格遵守知识库边界。

      【参考知识库】
      {ref_content}
    infer_concurrency: 4
    rag_concurrency: 3
    guardrail_timeout: 5
    infer_timeout: 30
    retry_ms: 3000
