# app-server/src/com/damon/ming/app/config/ai/rag/modules/source.yaml
# source 模块配置。
# 数据源配置 —— 各数据源类型的可配置参数。
#
# 文本数据源和 Markdown 数据源分别配置。
#
# 文本数据源预分块规则：
#   - enabled: 是否启用（大文件入库前按自然边界切分成多个 Document）
#   - chunk_chars: 每个预分块的目标字符数（超过则触发切分）
#   - boundaries: 切分边界优先级列表（YAML 字符串，\\n 代表换行符）
#
# Markdown 数据源预分块规则：
#   - 按 ## / ### / #### 标题层级切分，超大段落按自然边界二次切分
#   - chunk_chars: 标题段落超过此长度时触发二次切分
#   - boundaries: 二次切分边界优先级

legacy_office_source:
  # 单个旧版 Office 文件转换超时（秒）
  conversion_timeout_seconds: 60

csv_source:
  # 每个 Document 包含的数据行数（不含表头）
  batch_rows: 50

xlsx_source:
  # 每个 Document 包含的数据行数（不含表头）
  batch_rows: 50

ocr:
  # OCR 推理设备：cpu 或 gpu；GPU 需要安装兼容 CUDA 的 Paddle 版本
  device: cpu

image_source:
  # 独立图片 OCR 支持的文件扩展名（带点号，小写）
  extensions:
    - ".bmp"
    - ".jpeg"
    - ".jpg"
    - ".png"
    - ".tif"
    - ".tiff"

text_source:
  # 纯文本数据源支持的文件扩展名（不含 Markdown）
  extensions:
    - ".txt"

  # 大文件预分块配置
  pre_chunk:
    enabled: true
    chunk_chars: 400
    boundaries:
      - "\\n\\n"
      - "\\n"
      - ""

markdown_source:
  # 超大标题段落的二次切分配置
  pre_chunk:
    enabled: true
    chunk_chars: 800
    boundaries:
      - "\\n\\n"
      - "\\n"
      - ""

pdf_source:
  # 是否从文本型 PDF 的嵌入图片中 OCR 提取文字
  enable_image_extract: true

doc_source:
  # 是否提取 Word 表格为 Markdown 表格（true 时每个表格生成独立 Document）
  include_tables: true

  # 超大段落的预分块配置
  pre_chunk:
    enabled: true
    chunk_chars: 600
    boundaries:
      - "\\n\\n"
      - "\\n"
      - ""

pptx_source:
  # 是否提取幻灯片中的表格为 Markdown 表格
  include_tables: true

  # 是否提取演讲者备注（speaker notes）
  include_notes: true

  # 是否提取幻灯片图片并 OCR 提取文字
  extract_images: true

  # 超大文本的预分块配置
  pre_chunk:
    enabled: true
    chunk_chars: 500
    boundaries:
      - "\\n\\n"
      - "\\n"
      - ""

html_source:
  # 是否保留超链接 URL（true 时链接转为 "文本 (URL)" 格式）
  include_links: true

  # 是否提取 HTML 表格为 Markdown 表格
  include_tables: true

  # 超大正文的预分块配置
  pre_chunk:
    enabled: true
    chunk_chars: 800
    boundaries:
      - "\\n\\n"
      - "\\n"
      - ""
