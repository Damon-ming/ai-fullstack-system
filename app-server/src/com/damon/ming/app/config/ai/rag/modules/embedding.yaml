# embedding 模块配置。
# 网关地址从 INFERENCE_GATEWAY_URL 读取；embedding 运行规格在本段集中配置。
transport:
  timeout_seconds: 60
roles:
  bge_m3:
    model_name: BAAI/bge-m3
    max_model_len: 8192
    max_input_tokens: 8182
    dimension: 1024
    api_key: ak_embedding
    query_prefix: ""
    passage_prefix: ""
    batch_size: 32
