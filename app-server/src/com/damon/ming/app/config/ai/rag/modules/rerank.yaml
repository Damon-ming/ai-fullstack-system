# app-server/src/com/damon/ming/app/config/ai/rag/modules/rerank.yaml
# rerank 模块配置。
# 当前使用一个多语言重排器；相对模型名从 model_dir 下加载。
model_dir: "${model_dir}/rerank"
roles:
  bge_reranker_v2_m3:
    model_name: bge-reranker-v2-m3
    batch_size: 16
    max_seq_len: 1024
    device: cuda
    window_overlap: 128
    max_windows_per_node: 5
    score_threshold: 0.5
    include_heading: true
    heading_prefix_template: "[{heading_path}]"
