# app-server/src/com/damon/ming/app/config/upload/upload-config.yaml
# 上传文件配置 —— 文件类型白名单 + 各自大小上限
#
# 规则：
#   - 扩展名不在 allowed_types 中的文件直接拒绝
#   - 文件大小超过该类型 max_size_bytes 时拒绝
#   - 扩展名不带点号，大小写不敏感

upload:
  # sha256 内存缓存 LRU 上限（超出时淘汰最久未用条目）
  sha_cache_max: 10000

  # 单次上传最大文件数
  max_files_per_request: 10

  # 支持的文件类型及各自大小上限（字节）
  # 扩展名不带点号，大小写不敏感
  allowed_types:
    pdf:
      max_size_bytes: 52428800   # 50MB —— PDF 知识库文档
      description: "PDF 文档"
    md:
      max_size_bytes: 10485760   # 10MB —— Markdown 文档
      description: "Markdown 文档"
    txt:
      max_size_bytes: 10485760   # 10MB —— 纯文本
      description: "纯文本文件"
    csv:
      max_size_bytes: 10485760   # 10MB —— CSV 表格数据
      description: "CSV 表格"
    xlsx:
      max_size_bytes: 52428800   # 50MB —— Excel 多 sheet 数据
      description: "Excel 表格"
    docx:
      max_size_bytes: 20971520   # 20MB —— Word 文档（含嵌入图片）
      description: "Word 文档"
    doc:
      max_size_bytes: 20971520   # 20MB —— 旧版 Word（需转换）
      description: "Word 文档(旧版)"
    pptx:
      max_size_bytes: 52428800   # 50MB —— PPT 演示文稿（含图表）
      description: "PPT 演示文稿"
    html:
      max_size_bytes: 5242880    # 5MB —— 网页文件
      description: "HTML 网页"
