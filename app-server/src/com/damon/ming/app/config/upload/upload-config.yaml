# app-server/src/com/damon/ming/app/config/upload/upload-config.yaml
# 上传文件配置 —— 文件类型白名单 + 各自大小上限
#
# 规则：
#   - 扩展名不在 allowed_types 中的文件直接拒绝
#   - 文件大小超过该类型 max_size_bytes 时拒绝
#   - 扩展名不带点号，大小写不敏感

upload:
  # sha256 内存缓存 LRU 上限（超出时淘汰最久未用条目）
  sha_cache_max: 10000

  # 支持的文件类型及各自大小上限（字节）
  # 扩展名不带点号，大小写不敏感
  allowed_types:
    pdf:
      max_size_bytes: 52428800   # 50MB —— PDF 知识库文档
      description: "PDF 文档"
    md:
      max_size_bytes: 10485760   # 10MB —— Markdown 文档
      description: "Markdown 文档"
    txt:
      max_size_bytes: 10485760   # 10MB —— 纯文本
      description: "纯文本文件"
