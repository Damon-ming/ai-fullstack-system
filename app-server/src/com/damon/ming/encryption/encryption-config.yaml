# app-server/src/com/damon/ming/encryption/encryption-config.yaml
# 加密体系配置 —— 纯技术层，不含业务信息

encryption:
  # 开发环境
  default:
    rsa_key_size: 2048
    session_ttl_hours: 24
    signature_secret: "signature-secret"

  # 生产环境
  production:
    rsa_key_size: 4096
    session_ttl_hours: 12
    signature_secret: ""  # 生产环境必须通过环境变量 SIGNATURE_SECRET 注入
