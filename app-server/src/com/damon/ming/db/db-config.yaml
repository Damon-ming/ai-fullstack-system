# app-server/src/com/damon/ming/db/db-config.yaml
# 数据库连接配置 —— 纯技术层，不含业务信息

db:
  # 开发环境：本地 PostgreSQL
  default:
    host: localhost
    port: 5432
    dbname: damon_dev
    user: postgres
    password: ""
    pool_min: 1
    pool_max: 5
    connect_timeout: 10
    retry: 3

  # 生产环境：通过环境变量覆盖（DB_CONNECTION 优先级更高）
  production:
    host: localhost
    port: 5432
    dbname: damon_prod
    user: postgres
    password: ""
    pool_min: 2
    pool_max: 10
    connect_timeout: 15
    retry: 3
