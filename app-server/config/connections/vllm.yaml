# app-server/config/connections/vllm.yaml
# vLLM 连接配置 —— INFERENCE_SERVER=vllm 时使用
#
# 仅包含连接/路由参数（推理服务相关）。
# 模型参数（temperature/top_p/max_tokens）在 app/config/inference/inference-runtime.yaml，与后端无关。
#
# vLLM 多实例 + Gateway 路由模式。
# api_key 决定路由到哪个 vLLM 实例，gateway 自动注入 model。

engine: vllm
base_url: http://vllm-gateway:8080/v1
default_timeout: 180

roles:
  chat:
    api_key: ak_chat_001

  intent:
    api_key: ak_intent_001

  rewrite:
    api_key: ak_rewrite_001

  summary:
    api_key: ak_summary_001

  guardrail:
    api_key: ak_intent_001          # 复用 intent 实例（同模型）
