# app-server/config/docker/docker-vllm.yaml
# vLLM 推理服务集群 —— INFERENCE_SERVER=vllm 时启动
#
# 架构：app-server → gateway (按 api_key 路由) → vllm-{role} 实例
# 配套：inference/gateway.py + config/gateway.yaml + inference/Dockerfile.gateway

services:
  # ── API Gateway ──────────────────────────────────────────────────
  vllm-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: vllm-gateway
    restart: always
    ports:
      - "8010:8080"
    volumes:
      - /app-server/config/gateway.yaml:/etc/gateway/gateway.yaml:ro
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── vLLM 实例 ────────────────────────────────────────────────────
  vllm-intent:
    image: vllm/vllm-openai:latest
    container_name: vllm-intent
    restart: always
    ports:
      - "8011:8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/Qwen2.5-0.5B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.3
      --max-model-len 2048
      --api-key akUpstream
    networks:
      - ai-network

  vllm-rewrite:
    image: vllm/vllm-openai:latest
    container_name: vllm-rewrite
    restart: always
    ports:
      - "8012:8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/Qwen2.5-1.8B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.4
      --max-model-len 4096
      --api-key akUpstream
    networks:
      - ai-network

  vllm-chat:
    image: vllm/vllm-openai:latest
    container_name: vllm-chat
    restart: always
    ports:
      - "8013:8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/Qwen2.5-7B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.7
      --max-model-len 8192
      --api-key akUpstream
    networks:
      - ai-network

  vllm-summary:
    image: vllm/vllm-openai:latest
    container_name: vllm-summary
    restart: always
    ports:
      - "8014:8000"
    volumes:
      - /root/ming/models:/models
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    command: >
      --host 0.0.0.0 --port 8000
      --model /models/Qwen2.5-1.5B-Instruct
      --trust-remote-code
      --gpu-memory-utilization 0.4
      --max-model-len 4096
      --api-key akUpstream
    networks:
      - ai-network
