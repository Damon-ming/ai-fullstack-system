# docker-compose.yaml
# ═══════════════════════════════════════════════════════════════════
# 根目录 docker-compose.yaml —— 一键部署入口
#
# 推理后端通过 INFERENCE_SERVER 环境变量选择（唯一开关）：
#   INFERENCE_SERVER=ollama  → 启动 Ollama 容器（默认）
#   INFERENCE_SERVER=vllm    → 启动 vLLM 集群 + Gateway
#
# 可直接执行的命令：
#
#   开发（Ollama）:
#     SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 docker compose up -d --build
#
#   开发（vLLM）:
#     SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 INFERENCE_SERVER=vllm docker compose up -d --build
#
#   停止:
#     docker compose down
#
# 新增推理后端（如 sglang）：
#   1. 新建 inference-gateway/config/docker/docker-sglang.yaml（容器编排）
#   2. inference-gateway/config/gateway.yaml 加路由条目
#   3. app-server/docker-compose.yaml 的 INFERENCE_API_KEYS 加映射
#   4. app-server inference-runtime.yaml 加 roles 参数
#   5. 部署时 INFERENCE_SERVER=sglang
# ═══════════════════════════════════════════════════════════════════

include:
  - inference-gateway/config/docker/docker-${INFERENCE_SERVER:-ollama}.yaml
  - inference-gateway/docker-compose.yaml
  - app-server/docker-compose.yaml
  - web-app/docker-compose.yaml

# 共享网络：所有服务通过容器名互相发现
networks:
  ai-network:
    name: ai-network
    driver: bridge
