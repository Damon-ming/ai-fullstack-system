# docker-compose.yaml
# ═══════════════════════════════════════════════════════════════════
# 根目录 docker-compose.yaml —— 一键部署入口
#
# 推理后端通过 INFERENCE_SERVER 环境变量选择：
#   INFERENCE_SERVER=ollama  → 启动 Ollama 容器（默认）
#   INFERENCE_SERVER=vllm    → 启动 vLLM 集群 + Gateway
#
# 部署时配置生成：
#   INFERENCE_SERVER=vllm  → config/templates/vllm.yaml  → config/backends.yaml
#   INFERENCE_SERVER=ollama → config/templates/ollama.yaml → config/backends.yaml
#
# 可直接执行的命令：
#
#   开发（Ollama）:
#     SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 docker compose up -d --build
#
#   开发（vLLM）:
#     SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 INFERENCE_SERVER=vllm docker compose up -d --build
#
#   停止:
#     docker compose down
#
# 新增推理后端（如 sglang）：
#   1. 新建 app-server/inference/docker-sglang.yaml（容器编排）
#   2. 新建 app-server/inference/gateway-sglang.yaml（路由表，如需要 gateway）
#   3. 新建 app-server/ai/config/templates/sglang.yaml（业务参数模板）
#   4. 部署时 INFERENCE_SERVER=sglang → 模板复制为 backends.yaml
#   app-server 代码零改动
# ═══════════════════════════════════════════════════════════════════

include:
  - app-server/inference/docker-${INFERENCE_SERVER:-ollama}.yaml
  - app-server/docker-compose.yaml
  - web-app/docker-compose.yaml

# 共享网络：所有服务通过容器名互相发现
networks:
  ai-network:
    name: ai-network
    driver: bridge
