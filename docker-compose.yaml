# docker-compose.yaml
# ═══════════════════════════════════════════════════════════════════
# 根目录 docker-compose.yaml —— 一键部署入口
#
# ═══════════════════════════════════════════════════════════════════
# 端口分配表
# ═══════════════════════════════════════════════════════════════════
#  宿主机端口              服务                  容器内端口
#  ─────────────────────────────────────────────────────────────
#  80                      web-app                80      前端入口
#  5432                    postgres               5432    数据库
#
#  以下仅容器内访问（expose，不映射宿主机）：
#  8000                    app-server             8000    后端API
#  8080                    model-gateway         8080    网关
#  8000×2                  vllm-inferences-001/002  8000 主推理和摘要实例
#  8000                    vllm-embedding         8000    RAG embedding
#
# 生成推理后端选择；embedding 固定使用独立 vLLM 服务：
#   INFERENCE_SERVER=vllm    → 启动 vLLM 集群 + Gateway
#
# 优先级：命令行传值 > .env 文件 > 默认值（vllm）
# 建议始终在 .env 中设置 INFERENCE_SERVER，或命令行显式传入
#
# 一键启动前先运行 python model-gateway/export_model_env.py，之后执行 docker compose up -d --build。
#
#   开发（vLLM 推理 + vLLM embedding，需 GPU）:
#     SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 docker compose up -d --build
#
#   部署（vLLM 推理 + vLLM embedding）:
#     SERVER_BUILD_ENV=1 FRONTEND_BUILD_ENV=1 INFERENCE_SERVER=vllm docker compose up -d --build
#
#   停止:
#     docker compose down
#
# 新增推理后端（如 sglang）：
#   1. 新建 model-gateway/config/docker/docker-sglang.yaml（容器编排）
#   2. model-gateway/config/gateway.yaml 加路由条目
#   3. 配置推理角色与网关路由密钥
#   4. app-server/src/com/damon/ming/app/config/ai/inference/inference-config.yaml 加 roles 参数
#   5. 部署时 INFERENCE_SERVER=sglang
# ═══════════════════════════════════════════════════════════════════

include:
  - path:
      - model-gateway/config/docker/docker-${INFERENCE_SERVER:-vllm}-inference.yaml
      - model-gateway/config/docker/docker-vllm-embedding.yaml
    env_file: ./model-gateway-models.env
  - path:
    - app-server/docker-compose.yaml
    - model-gateway/docker-compose.yaml
    - web-app/docker-compose.yaml

# SECURITY: P1-27 全 compose 无 CPU/内存 limits。
# 单租户可控（自己不会打自己）；vLLM 无 limits 时多实例可争抢宿主机 RAM，
# OOM killer 可能误杀 postgres / app-server。
# 上公网 / 多租户前加 deploy.resources.limits（按实际使用量调校，vLLM 需预留 KV cache 空间）。

# ai-network 供后端与数据库、推理服务通信；proxy-network 仅连接 Nginx 与后端。
# 后端同时加入两个网络，前端容器无法直接访问数据库或推理服务。
networks:
  ai-network:
    name: ai-network
    driver: bridge
  proxy-network:
    name: ai-proxy-network
    driver: bridge
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_SUBNET}
